version: 2
updates:
  # Root hub — daily so high/critical CVEs do not wait a week for Nightly to fail.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Bratislava"
    open-pull-requests-limit: 8
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"

  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Bratislava"
    open-pull-requests-limit: 5
    groups:
      mcp-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/portal"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Bratislava"
    open-pull-requests-limit: 5
    groups:
      portal-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/packages/kya-verify"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
