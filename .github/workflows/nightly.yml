name: Nightly

on:
  schedule:
    # 03:15 UTC daily
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
            portal/package-lock.json

      - name: Install deps
        run: |
          npm ci
          (cd mcp && npm ci)
          (cd portal && npm ci)

      # Soft: nové CVE v deps padajú zvonku (npm advisory DB) — nesmú spamovať Nightly fail mail.
      # Tvrdý gate ostáva v CI (push/PR). Soft fail = annotation + log, job = green.
      - name: Security audit (high+, soft)
        id: audit
        continue-on-error: true
        run: npm run ci:audit

      - name: Annotate soft audit failure
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=ci:audit soft-fail::Nightly security audit našiel high+ CVE. Oprav bumpom deps (tvrdý gate = CI na push). Job ostáva zelený zámerne."

      - name: Smoke tests (hermetic)
        run: npm run ci:smoke
