# =====================================================================
#  jasnelabs.eu — static studio hub (black + yellow, klubo-like)
#  Canonical: www.jasnelabs.eu
# =====================================================================

server {
    listen 80 default_server;
    server_name jasnelabs.eu www.jasnelabs.eu _;

    root /var/www/jasnelabs;
    index index.html;

    access_log /var/log/nginx/jasnelabs-access.log;
    error_log  /var/log/nginx/jasnelabs-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # SEO: nikdy nespadnúť do SPA fallbacku; obslúži aj apex (GSC fetch bez 301)
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        if ($host = jasnelabs.eu) {
            return 301 https://www.jasnelabs.eu$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
