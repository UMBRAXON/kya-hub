# =====================================================================
#  KLUBO.sk — Next.js on host :3010 (prod) + :3015 (staging)
#  Canonical: www.klubo.sk
#  Staging: staging.klubo.sk (Basic auth — internal experiments only)
#  Mounted as /etc/nginx/conf.d/default.conf in klubo-proxy
# =====================================================================

map $http_x_forwarded_for $real_client_ip {
    default $remote_addr;
    "~*^(?<first>[^,]+)" $first;
}

upstream klubo_backend {
    server host.docker.internal:3010 max_fails=3 fail_timeout=10s;
    keepalive 4;
}

upstream klubo_staging_backend {
    server host.docker.internal:3015 max_fails=3 fail_timeout=10s;
    keepalive 2;
}

server {
    listen 80 default_server;
    server_name klubo.sk www.klubo.sk _;

    access_log /var/log/nginx/klubo-access.log;
    error_log  /var/log/nginx/klubo-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 2m;

    if ($host = klubo.sk) {
        return 301 https://www.klubo.sk$request_uri;
    }

    # Cron-generated IG drafts + download hubs — bypass Next (prod only serves public/ files present at build)
    location ^~ /marketing/downloads/ {
        alias /var/www/klubo/marketing/downloads/;
        index index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://klubo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        # TLS terminates at Cloudflare / outer proxy — Next must not see http://localhost:3010.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------
# Staging — oddelené od produkcie / Capacitor WebView
# Basic auth; push/e-mail muted v appke (KLUBO_DISABLE_NOTIFY)
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name staging.klubo.sk;

    access_log /var/log/nginx/klubo-staging-access.log;
    error_log  /var/log/nginx/klubo-staging-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    auth_basic "Klubo staging";
    auth_basic_user_file /etc/nginx/secrets/klubo-staging.htpasswd;

    location / {
        proxy_pass http://klubo_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
