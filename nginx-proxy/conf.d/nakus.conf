# =====================================================================
#  NAKUS.sk — Next.js porovnávač (:3002) + legacy static root (nepoužíva sa na /)
#  Host: nakus.sk, www.nakus.sk
#  Homepage `/` = Next (owner 2026-07-25 — Vite landing zrušená)
# =====================================================================

upstream nakus_next_backend {
    server host.docker.internal:3002 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

# -----------------------------------------------------------------
# NaKus catalog scraper guard (2026-08-17 — Dragonfly /krmivo vlna)
# Requires $real_client_ip map from conf.d/default.conf (loads first).
# -----------------------------------------------------------------

# Affiliate/price scrapers — hard deny (nie Google/Bing index).
map $http_user_agent $nakus_scraper_deny {
    default 0;
    ~*dragonfly 1;
    ~*publisherdiscovery 1;
    ~*bytespider 1;
    ~*semrushbot 1;
    ~*ahrefsbot 1;
    ~*petalbot 1;
}

# Ops monitor + prázdna kľúč = bez rate limitu.
map $http_user_agent $nakus_catalog_limit_key {
    default $real_client_ip;
    ~*NAKUS-ops-watch "";
}

# ~45 req/min/IP — stačí pre ľudí, brzdí scraper burst (Dragonfly mal 4000/deň z 1 IP).
limit_req_zone $nakus_catalog_limit_key zone=nakus_catalog:10m rate=45r/m;

# KLUBO — kanonicky www.klubo.sk (upstream žije v klubo.conf)

server {
    listen 80;
    server_name nakus.sk www.nakus.sk;

    access_log /var/log/nginx/nakus-access.log kyahub_log;
    error_log  /var/log/nginx/nakus-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    if ($host = nakus.sk) {
        return 301 https://www.nakus.sk$request_uri;
    }

    root /var/www/nakus;
    index index.html;

    # KLUBO — legacy path → vlastná doména
    location = /klubo {
        return 301 https://www.klubo.sk/;
    }
    location ^~ /klubo/ {
        rewrite ^/klubo/(.*)$ https://www.klubo.sk/$1$is_args$args permanent;
    }

    # Next.js porovnávač (dev na :3002) — port nie je verejný, ide cez 80/443
    # ^~ = regex pre statické .js/.css nižšie nesmie prepísať /_next/*
    location ^~ /_next/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Homepage = Next.js (owner 2026-07-25 — Vite landing zrušená).
    # Explicit exact match, aby `index index.html` + root nikdy nechytil `/`.
    location = / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Častý preklep v segmente (sprchvoe).
    location = /sprchvoe-gely {
        return 301 /sprchove-gely;
    }

    location = /sprchvoe-gely/ {
        return 301 /sprchove-gely;
    }

    # Legacy test cesta — noindex (duplicita oproti /)
    location ^~ /preview {
        include /etc/nginx/snippets/proxy-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/preview/?(.*)$ /$1 break;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /plienky {
        include /etc/nginx/snippets/nakus-catalog-guard.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /krmivo {
        include /etc/nginx/snippets/nakus-catalog-guard.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /dojcenske-mlieko {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /detske-prikrmy {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /avivaz {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /pranie {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /sprchove-gely {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /vyziva {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /hladaj {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Legacy kategórie / krátke odkazy (marketing, staré linky) — musí ísť do Next redirectov.
    # Príklad: /k/pet → /krmivo, /k/pranie → /pranie-tablety, /k/sprchove-gely → /sprchove-gely
    location ^~ /k/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Legacy „mega group“ URL z interných odkazov / share — nech neskončí na statickej landing.
    location ^~ /domacnost {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /proteinove-tycinky {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /protein {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /kreatin {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /vlhcene-utierky {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /hlavice-kefky {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /kava {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /filtre-kavovar {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /papier {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /tonery {
        include /etc/nginx/snippets/nakus-catalog-guard.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /pravne {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /pre-obchody {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /blog {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /odpoved {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /usetri {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /casto-kladene-otazky {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /out/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /p/ {
        include /etc/nginx/snippets/nakus-catalog-guard.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # SEO — robots.txt + sitemap.xml generuje Next (app/robots.ts, app/sitemap.ts).
    # Exact match má prednosť pred „location /" (inak padnú na statický index.html).
    location = /robots.txt {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # IndexNow key (Bing/Yandex) — Next public/, nie statická landing
    location = /nakus2026indexnow.txt {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # LLM / AI assistant index (public/llms*.txt)
    location = /llms.txt {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }
    location = /llms-full.txt {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Brand mark (surikata head) — static from dist, nie cez Next (odolné voči proxy/cache)
    location ^~ /brand/ {
        alias /var/www/nakus/brand/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types { image/png png; }
        default_type image/png;
    }

    # Default share preview (WhatsApp/FB) — Next public/og-default.* (nie starý dist logo)
    location = /og-default.png {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }
    location = /og-default.jpg {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Printable IG plan (static HTML, not via Next)
    location = /marketing/ig-plan-komplet.html {
        alias /var/www/nakus/marketing/ig-plan-komplet.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Owner download packs (JPG/PNG/HTML) — static, nie cez Next
    # Agent: public/marketing/downloads/<slug>/ + sync do /var/www/nakus/marketing/downloads/
    location ^~ /marketing/downloads/ {
        alias /var/www/nakus/marketing/downloads/;
        autoindex off;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
        types {
            text/html html;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            application/zip zip;
            application/pdf pdf;
        }
    }

    # Marketing assety (IG/FB) — Next public/marketing/
    location ^~ /marketing/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nakus_next_backend;
    }

    # Žiadny try_files catch-all na .css/.js/.png — lámalo by to Next /_next/static
    # a public/ assety, ak nie sú v /var/www/nakus. Všetko ide cez Next (:3002).
}
