# =====================================================================
#  kya-hub-proxy  —  Ambassador for umbraxon + nakus (+ separate klubo)
#
#  Start:   cd /root/kya-hub/nginx-proxy && docker compose up -d
#  Reload:  docker exec kya-hub-proxy nginx -s reload
# =====================================================================

services:
  kya-hub-proxy:
    image: nginx:1.27-alpine
    container_name: kya-hub-proxy
    restart: unless-stopped
    environment:
      VIRTUAL_HOST_NAME: "kyahub"
      VIRTUAL_HOST: "umbraxon.xyz,www.umbraxon.xyz,bots.umbraxon.xyz,nakus.sk,www.nakus.sk"
      VIRTUAL_PORT: "80"
      VIRTUAL_NETWORK: "nginx-proxy"
      LETSENCRYPT_HOST: "umbraxon.xyz,www.umbraxon.xyz,bots.umbraxon.xyz,nakus.sk,www.nakus.sk"
      LETSENCRYPT_EMAIL: "admin@umbraxon.xyz"
      HSTS: "max-age=63072000; includeSubDomains; preload"
    volumes:
      - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf.d/nakus.conf:/etc/nginx/conf.d/nakus.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ../nakus/dist:/var/www/nakus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - btcpay-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=2", "http://127.0.0.1/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Separate VIRTUAL_HOST / LE cert so Klubo never risks umbraxon+nakus cert renewal
  klubo-proxy:
    image: nginx:1.27-alpine
    container_name: klubo-proxy
    restart: unless-stopped
    environment:
      VIRTUAL_HOST_NAME: "klubo"
      VIRTUAL_HOST: "klubo.sk,www.klubo.sk,staging.klubo.sk"
      VIRTUAL_PORT: "80"
      VIRTUAL_NETWORK: "nginx-proxy"
      LETSENCRYPT_HOST: "klubo.sk,www.klubo.sk,staging.klubo.sk"
      LETSENCRYPT_EMAIL: "admin@umbraxon.xyz"
      HSTS: "max-age=63072000; includeSubDomains; preload"
    volumes:
      - ./conf.d/klubo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./secrets/klubo-staging.htpasswd:/etc/nginx/secrets/klubo-staging.htpasswd:ro
      - /root/klubo/public/marketing/downloads:/var/www/klubo/marketing/downloads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - btcpay-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=2", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  jasnelabs-proxy:
    image: nginx:1.27-alpine
    container_name: jasnelabs-proxy
    restart: unless-stopped
    environment:
      VIRTUAL_HOST_NAME: "jasnelabs"
      VIRTUAL_HOST: "jasnelabs.eu,www.jasnelabs.eu"
      VIRTUAL_PORT: "80"
      VIRTUAL_NETWORK: "nginx-proxy"
      LETSENCRYPT_HOST: "jasnelabs.eu,www.jasnelabs.eu"
      LETSENCRYPT_EMAIL: "hello@jasnelabs.eu"
      HSTS: "max-age=63072000; includeSubDomains; preload"
    volumes:
      - ./conf.d/jasnelabs.conf:/etc/nginx/conf.d/default.conf:ro
      - ../jasnelabs/dist:/var/www/jasnelabs:ro
    networks:
      - btcpay-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=2", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  btcpay-net:
    name: generated_default
    external: true
